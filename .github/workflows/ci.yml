name: Test
'on':
  push:
    branches:
    - hist/**
  workflow_dispatch:
    inputs:
      label:
        description: Label of the run
        default: ''
jobs:
  test:
    env:
      GOPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
    strategy:
      matrix:
        go-version:
        - 1.24.x
        - 1.27.x
        os:
        - ubuntu-22.04
    runs-on: ubuntu-22.04
    steps:
    - name: sensor probe
      uses: slashben/bstab-probe/probe@a6bd9ce3808926be68f077ec121bd8a762922b42
      with:
        token: ${{ github.token }}
        label: ${{ inputs.label }}
        matrix: ${{ toJSON(matrix) }}
    - name: Install Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
        cache: false
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
    - name: Test
      run: 'go get -d -t ./...

        make test

        '
permissions:
  contents: write
# stability test copy
